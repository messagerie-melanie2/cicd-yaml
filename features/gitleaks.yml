gitleaks-scan:
  stage: quality
  rules:
    - if: $LAUNCH_FEATURE !~ /scan-secret-gitleaks/
      when: never
    # Uniquement sur un push (commits du push), un schedule ou un lancement manuel (tout l'historique).
    # Pas sur un trigger : le projet déclencheur a déjà scanné ses propres commits.
    - if: $CI_PIPELINE_SOURCE =~ /^(push|schedule|web)$/
      when: always
    - when: never
  tags:
    - $RUNNER_TAGS
  # Démarre tout de suite, sans attendre les jobs des stages précédents
  needs: []
  image:
    name: ${REGISTRY_DOMAIN}${CICD_NAMESPACE}${GITLEAKS_PATH}:${GITLEAKS_TAG}
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"  # Historique complet, nécessaire pour scanner les commits
    GITLEAKS_REPORT_PATH: "gitleaks-report.xml"
  script:
    - sh /entrypoint/gitleaks_scan.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks-report.xml
    reports:
      junit: gitleaks-report.xml
  allow_failure: true

clean-registry-ghost-image:
  stage: maintenance
  rules:
    - if: $ENABLE_BUILD != 'yes'
      when: never
    - if: $LAUNCH_FEATURE =~ /clean-registry-ghost-image/
      when: always
    - when: never
  tags:
    - $RUNNER_TAGS
  needs:
    - get-files-from-git
  image: ${REGISTRY_DOMAIN}${CICD_NAMESPACE}${PYTHON_PROCESS_PATH}:${PYTHON_PROCESS_TAG}
  script:
    - cd ${CICD_SCRIPT_FOLDER}
    - python3 -m ${PYTHON_CLEAN_REGISTRY_SCRIPT_PACKAGE}
      --delete-ghost-image
      --path ../
      --current-repo ${CI_PROJECT_NAME}
      --project-id ${CI_PROJECT_ID} 
      --token ${CICD_API_TOKEN}

